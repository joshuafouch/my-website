# Weekly dependency PRs into staging (feature branches merge into staging; see branch-flow.yml).
# Security-advisory PRs are separate: GitHub opens those against the default branch (main).
version: 2
updates:
  - package-ecosystem: npm # covers pnpm-lock.yaml
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
