<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.png" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('site-motion') === 'off') {
            document.documentElement.dataset.motion = 'off';
          }
        } catch (e) {}
        try {
          var saved = localStorage.getItem('site-theme');
          var mode = 'polar-night';
          if (saved === 'light' || saved === 'snow-storm') mode = 'snow-storm';
          else if (saved === 'frost') mode = 'frost';
          var daisy = mode === 'snow-storm' ? 'nord' : mode === 'frost' ? 'frost' : 'nord-dark';
          var doc = document.documentElement;
          doc.setAttribute('data-theme', daisy);
          doc.classList.add(mode);
          doc.style.colorScheme = mode === 'snow-storm' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
